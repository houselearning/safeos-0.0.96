set default=0
set timeout=0
set timeout_style=hidden

# Load required modules for graphics
insmod all_video
insmod vbe
insmod vga
insmod gfxterm

# Explicitly set graphics mode before terminal output
set gfxmode=1024x768x32
terminal_output gfxterm

# Set gfxpayload to pass graphics info to kernel via multiboot
set gfxpayload=keep

# Try to set root to the CD/ISO containing SafeOS.bin
search --file /SafeOS.bin --set=root || true

menuentry "SafeOS 1.0 (Graphics Mode)" {
    insmod gfxterm
    insmod vbe
    insmod vga
    # Force graphics terminal for this menu entry
    terminal_output gfxterm
    echo ""
    echo "=========================================="
    echo "    SafeOS 1.0 - Booting..."
    echo "=========================================="
    echo ""
    echo "Setting graphics mode 1024x768x32..."
    set gfxmode=1024x768x32
    set gfxpayload=keep
    
    if [ -f /SafeOS.bin ]; then
        echo "Loading kernel..."
        multiboot /SafeOS.bin
        echo "Starting boot..."
        boot
    else
        echo "ERROR: SafeOS.bin not found on this media."
        echo "Please check the ISO contents."
        sleep 5
    fi
}

menuentry "SafeOS 1.0 (Debug Mode, Serial Console)" {
    insmod serial
    serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
    terminal_output serial
    echo "Booting SafeOS 1.0 in debug mode..."
    if [ -f /SafeOS.bin ]; then
        multiboot /SafeOS.bin debug=1
        boot
    else
        echo "ERROR: SafeOS.bin not found on this media."
        sleep 3
        chainloader +1
        boot
    fi
}

menuentry "SafeOS 1.0 (VESA Fallback 800x600)" {
    set gfxpayload=800x600x32
    echo "Booting SafeOS 1.0 with 800x600 framebuffer..."
    if [ -f /SafeOS.bin ]; then
        multiboot /SafeOS.bin
        boot
    else
        echo "ERROR: SafeOS.bin not found on this media."
        sleep 3
        chainloader +1
        boot
    fi
}

menuentry "System information" {
    echo "SafeOS 1.0 - Boot Environment"
    echo "------------------------------"
    echo "Current date/time:"
    date
    echo
    echo "Available video modes:"
    vbeinfo
    echo
    echo "Press ESC to return to the menu."
    sleep --interruptible 10
}

if [ ${timeout} -gt 0 ]; then
    echo "Auto-booting SafeOS 1.0 in ${timeout} seconds..."
fi
